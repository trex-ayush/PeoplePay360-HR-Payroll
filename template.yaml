AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  PeoplePay360 — HR & Payroll platform.
  Express API on Lambda behind an HTTP API; the Vite build on S3 behind
  CloudFront. CloudFront sends /api/* to the API, so the SPA and the API share
  one origin and the client keeps calling relative /api paths with no CORS.

Parameters:
  MongoUri:
    Type: String
    NoEcho: true
    Description: MongoDB Atlas connection string.
  JwtSecret:
    Type: String
    NoEcho: true
    Description: Secret used to sign JWTs.
  AdminSecret:
    Type: String
    NoEcho: true
    Description: Secret that allows the very first admin to be created.
  ClientOrigin:
    Type: String
    Default: ''
    Description: >
      Public site URL. It goes into invite links and the CORS allow list.
      Leave blank on the first deploy, then set it to the CloudFrontURL output
      and deploy again.
  SmtpHost:
    Type: String
    Default: ''
  SmtpPort:
    Type: String
    Default: '587'
  SmtpUser:
    Type: String
    Default: ''
  SmtpPass:
    Type: String
    NoEcho: true
    Default: ''
  SmtpFrom:
    Type: String
    Default: 'PeoplePay360 <no-reply@peoplepay360.local>'

Globals:
  Function:
    Runtime: nodejs22.x
    # 30s is the HTTP API integration ceiling. Payrun compute is the only call
    # that comes close, and only with a large batch.
    Timeout: 30
    # Lambda scales CPU with memory, so this also shortens bcrypt and cold start.
    MemorySize: 1024

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      CodeUri: server/
      Handler: src/lambda.handler
      Environment:
        Variables:
          NODE_ENV: production
          MONGODB_URI: !Ref MongoUri
          JWT_SECRET: !Ref JwtSecret
          ADMIN_SECRET: !Ref AdminSecret
          CLIENT_ORIGIN: !Ref ClientOrigin
          SMTP_HOST: !Ref SmtpHost
          SMTP_PORT: !Ref SmtpPort
          SMTP_USER: !Ref SmtpUser
          SMTP_PASS: !Ref SmtpPass
          SMTP_FROM: !Ref SmtpFrom
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-frontend-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # The bucket stays private; only this distribution can read it.
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution.Id}'

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} distribution'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: ApiOrigin
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            # Managed-CachingDisabled: an API response must never be cached.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed-AllViewerExceptHostHeader forwards Authorization; without it
            # every request would reach the API unauthenticated.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        # React Router owns the paths, so anything S3 cannot find is the SPA.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  CloudFrontURL:
    Description: Public site URL — serves the SPA and proxies /api/*.
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  ApiUrl:
    Description: Direct HTTP API endpoint, bypassing CloudFront. Useful for debugging.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  DistributionId:
    Description: CloudFront distribution id, used for cache invalidations.
    Value: !Ref CloudFrontDistribution
  FrontendBucketName:
    Description: S3 bucket holding the built frontend.
    Value: !Ref FrontendBucket
